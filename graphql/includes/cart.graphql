extend type Query {
    """
    Get the cart (by optional cartId, or session cart, or creates a new one)
    """
    getCart(
        cartId: ID @globalId(decode: ID)
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@getCartQuery")

    """
    Get available shipping options for the current cart
    """
    shippingOptions(
        cartId: ID @globalId(decode: ID)
    ): [ShippingOption!]!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@getShippingOptionsQuery")

    """
    Get estimated shipping options for arbitrary destination before full address entry
    """
    estimateShipping(
        cartId: ID @globalId(decode: ID)
        countryId: ID
        country: String
        state: String
        postcode: String
    ): [ShippingOption!]!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@estimateShippingQuery")
}

extend type Mutation {
    """
    Change the currency of the current cart
    """
    setCartCurrency(
        cartId: ID @globalId(decode: ID)
        currencyCode: String!
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@setCartCurrencyMutation")
    """
    Add or update a product variant in the cart
    """
    addProductVariantToCart(
        cartId: ID @globalId(decode: ID)
        productVariantID: ID!
        quantity: Int = 1
        meta: String
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@addProductVariantToCartMutation")

    """
    Update a specific line in the cart
    """
    updateCartLine(
        cartId: ID @globalId(decode: ID)
        cartLineID: ID!
        quantity: Int!
        meta: String
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@updateCartLineMutation")

    """
    Remove a specific line from the cart
    """
    removeCartLine(
        cartId: ID @globalId(decode: ID)
        cartLineID: ID!
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@removeCartLineMutation")

    """
    Clear all items from the cart
    """
    clearCart(
        cartId: ID @globalId(decode: ID)
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@clearCartMutation")

    """
    Set shipping address on the cart with optional automatic billing sync
    """
    setCartShippingAddress(
        cartId: ID @globalId(decode: ID)
        address: CartAddressInput!
        sameAsBilling: Boolean = false
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@setCartShippingAddressMutation")

    """
    Set billing address on the cart (supports custom invoice data or copying from shipping)
    """
    setCartBillingAddress(
        cartId: ID @globalId(decode: ID)
        address: CartAddressInput
        sameAsShipping: Boolean = false
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@setCartBillingAddressMutation")

    """
    Set shipping address on the cart from an existing customer address
    """
    setCartCustomerShippingAddress(
        cartId: ID @globalId(decode: ID)
        customerAddressId: ID! @globalId(decode: ID)
        shippingOption: String
        sameAsBilling: Boolean = false
    ): Cart!
    @guard
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@setCartCustomerShippingAddressMutation")

    """
    Set billing address on the cart from an existing customer address (or copy shipping)
    """
    setCartCustomerBillingAddress(
        cartId: ID @globalId(decode: ID)
        customerAddressId: ID @globalId(decode: ID)
        sameAsShipping: Boolean = false
    ): Cart!
    @guard
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@setCartCustomerBillingAddressMutation")

    """
    Apply a coupon code to the cart
    """
    applyCouponToCart(
        cartId: ID @globalId(decode: ID)
        coupon: String!
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@applyCouponToCartMutation")

    """
    Remove the currently applied coupon from the cart
    """
    removeCouponFromCart(
        cartId: ID @globalId(decode: ID)
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@removeCouponFromCartMutation")

    """
    Select shipping option for the cart
    """
    setCartShippingOption(
        cartId: ID @globalId(decode: ID)
        shippingOption: String!
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@setCartShippingOptionMutation")

    """
    Force calculate cart totals and taxes
    """
    calculateCart(
        cartId: ID @globalId(decode: ID)
    ): Cart!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\CartResolver@calculateCartMutation")
}

input CartAddressInput {
    countryId: ID
    country: String
    title: String
    firstName: String!
    lastName: String!
    companyName: String
    taxIdentifier: String
    vatNo: String
    lineOne: String!
    lineTwo: String
    lineThree: String
    city: String!
    state: String
    postcode: String!
    contactEmail: String
    contactPhone: String
    deliveryInstructions: String
    shippingOption: String
    saveAddress: Boolean
}
