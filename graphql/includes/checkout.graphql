extend type Mutation {
    """
    Create an order from the current session cart (or specified cart)
    """
    createOrderFromCart(
        cartId: ID @globalId(decode: ID)
    ): Order!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\OrderResolver@createOrderFromCart")
    @throttle(
        maxAttempts: 30
        decayMinutes: 1
    )

    """
    Record a privileged manual transaction against an order. External provider
    results must come from a verified server-side webhook.
    """
    recordOrderTransaction(
        orderId: ID! @globalId(decode: ID)
        amount: Int!
        type: String = "capture"
        driver: String = "manual"
        reference: String
        status: String = "success"
        notes: String
        cardType: String
        lastFour: String
        success: Boolean = true
        meta: String
    ): Transaction!
    @guard(with: ["web", "sanctum"])
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\OrderResolver@recordOrderTransactionMutation")
    @throttle(
        maxAttempts: 30
        decayMinutes: 1
    )

    """
    Initiate payment intent or session for cart or order
    """
    initiatePayment(
        cartId: ID @globalId(decode: ID)
        orderId: ID @globalId(decode: ID)
        provider: String = "stripe"
        meta: String
    ): PaymentIntentResponse!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\OrderResolver@initiatePaymentMutation")
    @throttle(
        maxAttempts: 30
        decayMinutes: 1
    )

    """
    Authorize a payment directly using Lunar's payment drivers (e.g. offline, cash-in-hand, or custom driver)
    """
    authorizePayment(
        cartId: ID @globalId(decode: ID)
        orderId: ID @globalId(decode: ID)
        paymentType: String = "cash-in-hand"
        meta: String
    ): PaymentAuthorizeResponse!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\OrderResolver@authorizePaymentMutation")
    @throttle(
        maxAttempts: 30
        decayMinutes: 1
    )
}

extend type Query {
    """
    Get configured payment providers
    """
    paymentProviders: [PaymentProvider!]!
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\OrderResolver@paymentProvidersQuery")

    """
    Get an order by ID or reference
    """
    order(
        id: ID! @globalId(decode: ID)
    ): Order
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\OrderResolver@getOrderQuery")

    """
    Get an order by reference
    """
    orderByReference(
        reference: String!
    ): Order
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\OrderResolver@getOrderByReferenceQuery")

    """
    Get a guest order securely by reference and email
    """
    guestOrder(
        reference: String!
        email: String!
    ): Order
    @field(resolver: "Lunargraphql\\GraphQL\\Resolvers\\OrderResolver@getGuestOrderQuery")

    """
    Get the authenticated user's orders
    """
    myOrders: [Order!]!
    @guard
    @paginate(builder: "Lunargraphql\\GraphQL\\Resolvers\\OrderResolver@myOrdersQuery", defaultCount: 10, maxCount: 50)
}
